<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolCrest — All Your Essential Online Tools in One Place</title>
    <meta name="description" content="Free, fast, and private online tools: Complete PDF Suite, QR Code Generator, Unit Converter, Time Zone Converter, Productivity Planners, and Knowledge Center. 100% in-browser processing." />
    <link rel="canonical" href="https://toolcrest.site/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ToolCrest — All Your Essential Online Tools in One Place" />
    <meta property="og:description" content="Free, fast, and private online tools: Complete PDF Suite, QR Code Generator, Unit Converter, Time Zone Converter, Productivity Planners, and Knowledge Center. 100% in-browser processing." />
    <meta property="og:url" content="https://toolcrest.site/" />
    <meta property="og:site_name" content="ToolCrest" />
    <meta property="og:type" content="website" />
    <!-- 1. Google Consent Mode v2 Default (Must precede CookieYes and Google tags) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Establish Google Consent Mode v2 baseline defaults
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });

      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Pre-check CookieYes cookie if visitor previously consented
      try {
        var ckyMatch = document.cookie.match(/(?:^|;\s*)cookieyes-consent=([^;]+)/);
        if (ckyMatch) {
          var ckyVal = decodeURIComponent(ckyMatch[1]);
          var isAnalyticsYes = ckyVal.indexOf('analytics:yes') !== -1;
          var isAdsYes = ckyVal.indexOf('advertisement:yes') !== -1;
          if (isAnalyticsYes) {
            gtag('consent', 'update', {
              'analytics_storage': 'granted',
              'ad_storage': isAdsYes ? 'granted' : 'denied',
              'ad_user_data': isAdsYes ? 'granted' : 'denied',
              'ad_personalization': isAdsYes ? 'granted' : 'denied'
            });
          }
        }
      } catch (e) {}
    </script>

    <!-- 2. CookieYes Integration & Consent Listener -->
    <script>
      document.addEventListener('cookieyes_consent_update', function (eventData) {
        try {
          var detail = eventData ? eventData.detail : null;
          var accepted = (detail && Array.isArray(detail.accepted)) ? detail.accepted : [];
          var analyticsGranted = accepted.indexOf('analytics') !== -1;
          var adsGranted = accepted.indexOf('advertisement') !== -1;
          var functionalGranted = accepted.indexOf('functional') !== -1;

          gtag('consent', 'update', {
            'analytics_storage': analyticsGranted ? 'granted' : 'denied',
            'ad_storage': adsGranted ? 'granted' : 'denied',
            'ad_user_data': adsGranted ? 'granted' : 'denied',
            'ad_personalization': adsGranted ? 'granted' : 'denied',
            'personalization_storage': functionalGranted ? 'granted' : 'denied',
            'functionality_storage': 'granted'
          });
        } catch (err) {}
      });
    </script>

    <!-- 3. Google tag (gtag.js) - Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EM9BQ097R4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Auto-detect DebugView for Google Tag Assistant and GA4 Debugging
      var isGaDebug = window.location.search.indexOf('gtm_debug=') !== -1 ||
                      window.location.search.indexOf('debug_mode=true') !== -1 ||
                      window.location.search.indexOf('ga_debug') !== -1;

      gtag('config', 'G-EM9BQ097R4', {
        send_page_view: false, // Prevents duplicate initial hit; tracked precisely by React SPA router & consent handler
        anonymize_ip: true,
        debug_mode: isGaDebug
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
