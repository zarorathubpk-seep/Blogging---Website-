<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- 1. Google Consent Mode v2 Default (Must precede CookieYes and Google tags) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Establish Google Consent Mode v2 baseline defaults
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });

      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Pre-check if visitor previously granted consent (CookieYes cookie or local preference)
      try {
        var ckyMatch = document.cookie.match(/(?:^|;\s*)cookieyes-consent=([^;]+)/);
        var ckyVal = ckyMatch ? decodeURIComponent(ckyMatch[1]) : '';
        var localConsent = '';
        try { localConsent = localStorage.getItem('toolcrest_analytics_consent') || ''; } catch (e) {}

        var isAnalyticsGranted = ckyVal.indexOf('analytics:yes') !== -1 || localConsent === 'granted' || localConsent === 'true';
        var isAdsGranted = ckyVal.indexOf('advertisement:yes') !== -1 || localConsent === 'granted';

        if (isAnalyticsGranted) {
          gtag('consent', 'update', {
            'analytics_storage': 'granted',
            'ad_storage': isAdsGranted ? 'granted' : 'denied',
            'ad_user_data': isAdsGranted ? 'granted' : 'denied',
            'ad_personalization': isAdsGranted ? 'granted' : 'denied'
          });
          window.__toolcrest_consent_already_granted = true;
        }
      } catch (e) {}
    </script>

    <!-- 2. CookieYes CMP Script Placeholder (Place your CookieYes script tag here if using CookieYes CMP) -->
    <!-- Example: <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/YOUR_COOKIEYES_KEY/script.js"></script> -->

    <!-- 3. CookieYes Consent Listener & Consent Mode v2 Synchronization -->
    <script>
      function onCookieYesConsent(detail) {
        try {
          var accepted = [];
          if (detail) {
            if (Array.isArray(detail.accepted)) {
              accepted = detail.accepted;
            } else if (Array.isArray(detail.categories)) {
              accepted = detail.categories;
            } else if (typeof detail.accepted === 'string') {
              accepted = detail.accepted.split(',').map(function(s){ return s.trim(); });
            }
          }
          var ckyMatch = document.cookie.match(/(?:^|;\s*)cookieyes-consent=([^;]+)/);
          var ckyVal = ckyMatch ? decodeURIComponent(ckyMatch[1]) : '';

          var analyticsGranted = accepted.indexOf('analytics') !== -1 || ckyVal.indexOf('analytics:yes') !== -1;
          var adsGranted = accepted.indexOf('advertisement') !== -1 || ckyVal.indexOf('advertisement:yes') !== -1;
          var functionalGranted = accepted.indexOf('functional') !== -1 || ckyVal.indexOf('functional:yes') !== -1;

          if (analyticsGranted) {
            gtag('consent', 'update', {
              'analytics_storage': 'granted',
              'ad_storage': adsGranted ? 'granted' : 'denied',
              'ad_user_data': adsGranted ? 'granted' : 'denied',
              'ad_personalization': adsGranted ? 'granted' : 'denied',
              'personalization_storage': functionalGranted ? 'granted' : 'denied',
              'functionality_storage': 'granted'
            });

            // If a consented page_view hasn't fired yet for the initial view, fire it now
            if (!window.__toolcrest_consented_pv_fired) {
              window.__toolcrest_consented_pv_fired = true;
              var isGaDebug = window.location.search.indexOf('gtm_debug=') !== -1 ||
                              window.location.search.indexOf('debug_mode=true') !== -1 ||
                              window.location.search.indexOf('ga_debug') !== -1;
              var pvParams = {
                page_path: window.location.pathname || '/',
                page_title: document.title || 'ToolCrest',
                page_location: window.location.href,
                send_to: 'G-EM9BQ097R4'
              };
              if (isGaDebug) pvParams.debug_mode = true;
              gtag('event', 'page_view', pvParams);
            }
          }
        } catch (err) {}
      }

      document.addEventListener('cookieyes_consent_update', function (e) {
        onCookieYesConsent(e ? e.detail : null);
      });
      window.addEventListener('cookieyes_consent_update', function (e) {
        onCookieYesConsent(e ? e.detail : null);
      });
    </script>

    <!-- 4. Google tag (gtag.js) - Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EM9BQ097R4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Auto-detect DebugView for Google Tag Assistant and GA4 Debugging
      var isGaDebug = window.location.search.indexOf('gtm_debug=') !== -1 ||
                      window.location.search.indexOf('debug_mode=true') !== -1 ||
                      window.location.search.indexOf('ga_debug') !== -1;

      gtag('config', 'G-EM9BQ097R4', {
        send_page_view: false, // Prevents duplicate initial hit; manual page_view is fired authoritatively
        debug_mode: isGaDebug
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</html>
