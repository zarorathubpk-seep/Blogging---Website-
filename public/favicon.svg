<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favGoldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="60%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#0B0F19" />
    </linearGradient>

    <linearGradient id="favGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="25%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#FFFBEB" />
      <stop offset="75%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <linearGradient id="favGoldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="40%" stopColor="#FDE047" />
      <stop offset="80%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>

    <filter id="favDropShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Crest Shield Base -->
  <path
    d="M24 3.5 L43 12.8 V29.5 C43 37.8 34.6 43.8 24 46.5 C13.4 43.8 5 37.8 5 29.5 V12.8 L24 3.5 Z"
    fill="url(#favGoldShield)"
    filter="url(#favDropShadow)"
  />

  <!-- 24K Gold Metallic Bevel Border -->
  <path
    d="M24 3.5 L43 12.8 V29.5 C43 37.8 34.6 43.8 24 46.5 C13.4 43.8 5 37.8 5 29.5 V12.8 L24 3.5 Z"
    stroke="url(#favGoldBorder)"
    stroke-width="2"
  />

  <!-- Inner Gold Precision Border -->
  <path
    d="M24 7 L40 14.5 V28.5 C40 35 33 40.5 24 43 C15 40.5 8 35 8 28.5 V14.5 L24 7 Z"
    stroke="url(#favGoldBorder)"
    stroke-width="1"
    stroke-opacity="0.6"
  />

  <!-- Gold Crown / Tool Apex Facet -->
  <path
    d="M24 12 L34 19.5 V28 L24 34 L14 28 V19.5 L24 12 Z"
    fill="url(#favGoldCrown)"
  />

  <!-- Diamond Precision Core -->
  <path
    d="M24 17 L29 23.5 L24 30 L19 23.5 Z"
    fill="url(#favGoldShield)"
  />

  <!-- Center Golden Star Spark -->
  <path
    d="M24 19.5 L25.5 23.5 L29.5 24 L25.5 24.5 L24 28.5 L22.5 24.5 L18.5 24 L22.5 23.5 Z"
    fill="url(#favGoldCrown)"
  />

  <circle cx="24" cy="24" r="1.3" fill="#FFFFFF" />
</svg>
